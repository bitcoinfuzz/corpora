name: Check

on: [push, pull_request]

jobs:
  select-tests:
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed corpora and select tests
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./.github/scripts/select-test-matrix.sh "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
    outputs:
      bitcoinfuzz-sha: ${{ steps.bitcoinfuzz-sha.outputs.sha }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Checkout bitcoinfuzz repo
        uses: actions/checkout@v4
        with:
          repository: bitcoinfuzz/bitcoinfuzz
          ref: v2
          path: bitcoinfuzz
          submodules: recursive

      - name: Record bitcoinfuzz commit
        id: bitcoinfuzz-sha
        run: echo "sha=$(git -C bitcoinfuzz rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install rust-toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Install go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lowdown libsodium-dev libboost-all-dev npm nodejs quickjs libquickjs autoconf automake libtool pkg-config

      - name: Install Boost 1.86 (libbitcoin-system requires >= 1.86)
        uses: ./.github/actions/setup-boost-186

      - name: Install elan and patchelf (btc-verified)
        run: |
          sudo apt-get install -y patchelf
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | \
            sh -s -- -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
          # Keep the checkout and its multi-GB Lake build (mathlib) out of the
          # uploaded modules/ artifact; only modules/btcverified/lib is needed.
          echo "BTC_VERIFIED_DIR=$RUNNER_TEMP/btc-verified" >> $GITHUB_ENV

      - name: Setup common environment
        run: |
          echo "CC=/usr/bin/clang" >> $GITHUB_ENV
          echo "CXX=/usr/bin/clang++" >> $GITHUB_ENV

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install mako

      - name: Build Modules
        timeout-minutes: 40
        working-directory: bitcoinfuzz
        run: |
          CXXFLAGS="-DBITCOIN_CORE \
          -DRUST_BITCOIN \
          -DBITCOIN_RS \
          -DRUSTBITCOINKERNEL \
          -DRUST_MINISCRIPT \
          -DBITCOINERLAB_MINISCRIPT \
          -DRUST_PSBT \
          -DRUST_MUSIG2 \
          -DRUSTCRYPTO_AES \
          -DBDK_SP \
          -DBLUEWALLET_SP \
          -DSPDK \
          -DBTCD \
          -DNBITCOIN \
          -DEMBIT \
          -DPYBITCOINKERNEL \
          -DBITCOINKERNEL \
          -DBTC_VERIFIED \
          -DLND \
          -DLDK \
          -DNLIGHTNING \
          -DLIGHTNING_KMP \
          -DBITCOINJ \
          -DBITCOINS \
          -DCLIGHTNING \
          -DECLAIR \
          -DDECRED_SECP256K1 \
          -DSECP256K1 \
          -DNBITCOIN_SECP256K1 \
          -DRUST_K256 \
          -DGOCOIN \
          -DLIBWALLY_CORE \
          -DCUSTOM_MUTATOR_P2P_MESSAGE \
          -DRUSTREEXO \
          -DUTREEXO \
          -DPYCOIN \
          -DPYHDWALLET \
          -DELECTRUM \
          -DLIBBITCOIN_SYSTEM" \
          ONLY_MODULES=1 \
          ./scripts/auto_build.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bitcoinfuzz-build
          path: |
            bitcoinfuzz/modules/
            bitcoinfuzz/custommutator/
            bitcoinfuzz/bitcoinfuzz
            bitcoinfuzz/NBitcoin.CppBridge.so
            bitcoinfuzz/NBitcoin.CppBridge.dylib
            bitcoinfuzz/NBitcoinSecp256k1.CppBridge.so
            bitcoinfuzz/external/secp256k1/include/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  test:
    needs: [build, select-tests]
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        # Only entries selected from changed corpus folders are instantiated.
        test: ${{ fromJSON(needs.select-tests.outputs.matrix) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-test-env
        with:
          bitcoinfuzz-ref: ${{ needs.build.outputs.bitcoinfuzz-sha }}

      - name: Pre-build step
        if: matrix.test.pre_build != ''
        timeout-minutes: 5
        run: ${{ matrix.test.pre_build }}

      - name: Setup Java
        if: matrix.test.setup_java == 'true'
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Python module packages
        run: |
          # run-fuzz.sh links the fuzzer against this runner's system Python, so
          # the enabled wrappers' packages must be installed there.
          # coincurve 20 (pinned by hdwallet) has no cp314 wheel and its sdist fails with scikit-build-core >= 0.10.
          echo 'scikit-build-core<0.10' > "$RUNNER_TEMP/build-constraints.txt"
          export PIP_CONSTRAINT="$RUNNER_TEMP/build-constraints.txt"        # pip < 26
          export PIP_BUILD_CONSTRAINT="$RUNNER_TEMP/build-constraints.txt"  # pip >= 26
          for module in embit pycoin pyhdwallet electrum pybitcoinkernel; do
            if [[ " ${{ matrix.test.cxxflags }} " == *" -D${module^^} "* ]]; then
              # py-bitcoinkernel builds Bitcoin Core's kernel, which finds Boost
              # through CMake; the runner's Boost 1.86 isn't on CMake's path.
              if [[ ${module} == pybitcoinkernel ]]; then
                sudo apt-get install -y libboost-dev
              fi
              if [[ ${module} == pybitcoinkernel ]]; then
                # pybitcoinkernel's CMakeLists.txt version is incompatible with
                # scikit-build-core<0.10, necessary for hdwallet's coincurve 20 dependency.
                env -u PIP_CONSTRAINT -u PIP_BUILD_CONSTRAINT \
                  python3 -m pip install --break-system-packages \
                  -r "bitcoinfuzz/modules/${module}/requirements.txt"
              else
                python3 -m pip install --break-system-packages \
                  -r "bitcoinfuzz/modules/${module}/requirements.txt"
              fi
            fi
          done

      - name: Test - ${{ matrix.test.target }}
        timeout-minutes: 5
        run: |
          export CC=/usr/bin/clang
          export CXX=/usr/bin/clang++
          FUZZ=${{ matrix.test.target }} ./.github/scripts/run-fuzz.sh \
          "${{ matrix.test.corpus }}" \
          "${{ matrix.test.target }}" \
          "${{ matrix.test.cxxflags }}" \
          "${{ matrix.test.asan_options }}" \
          "$CXX" \
          "-max_len=32768"
